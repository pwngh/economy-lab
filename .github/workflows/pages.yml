# Builds the one static site (docs at /, console at /console/) and deploys it to GitHub Pages.
# Manual trigger only: deploys are a deliberate act, not a side effect of a push.
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Full history: the docs' check:ref resolves the pinned REPO_REF commit, which a shallow
      # checkout would not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm ci --prefix apps/docs
      - run: npm ci --prefix apps/console
      - run: npm run build
      - run: npm run build:packages
      - run: npm run docs:api
      # The same one-command build a local `npm run site` produces. It runs before the gates
      # rather than after so that every input the table's `site` step needs is on disk: that step
      # skips when they are not, and a skipped compose here would upload whatever dist-site/ the
      # runner happened to have.
      - run: npm run site
      # The apps' gates run through the table, not a list of this workflow's own: the six it used
      # to name by hand had already drifted from ci.yml, and none of them had a build in front.
      # The tier ends with `site`, which re-composes dist-site/ from the builds the two steps
      # before it just made and checks the composed artifact — the CSP over a different _headers
      # from the docs app's own, and the .nojekyll without which Pages drops that file. Those were
      # two inline steps here, which is a gate list outside the one definition of green.
      - run: npm run check acceptance
      # _headers / _redirects are Cloudflare Pages rules; GitHub Pages ignores them, so drop them
      # from this artifact. Their CSP was already validated by check:csp above (it governs the
      # Cloudflare deploy, where the rules are honored).
      - run: rm -f dist-site/_headers dist-site/_redirects
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site
      - id: deployment
        uses: actions/deploy-pages@v4
